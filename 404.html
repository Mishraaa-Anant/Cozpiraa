<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found | CozPiraa Clinic</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root {
      --primary:   #0F766E;
      --secondary: #14B8A6;
      --accent:    #22C55E;
      --bg:        #F8FAFC;
      --text:      #0F172A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family:     'Poppins', sans-serif;
      background:      var(--bg);
      color:           var(--text);
      min-height:      100vh;
      display:         flex;
      align-items:     center;
      justify-content: center;
      overflow:        hidden;
    }
    .wrap {
      text-align: center;
      padding:    40px 24px;
      max-width:  520px;
    }
    .big-num {
      font-size:   10rem;
      font-weight: 900;
      line-height: 1;
      background:  linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip:         text;
      margin-bottom:           8px;
      animation:               float 3s ease-in-out infinite;
    }
    .icon-wrap {
      font-size:     3rem;
      color:         var(--primary);
      margin-bottom: 16px;
    }
    h1 {
      font-size:     1.8rem;
      font-weight:   800;
      margin-bottom: 12px;
    }
    p {
      color:         #64748B;
      font-size:     1rem;
      line-height:   1.7;
      margin-bottom: 36px;
    }
    .btn {
      display:         inline-flex;
      align-items:     center;
      gap:             8px;
      padding:         14px 32px;
      border-radius:   9999px;
      font-weight:     700;
      font-size:       .95rem;
      background:      linear-gradient(135deg, var(--primary), var(--secondary));
      color:           #fff;
      text-decoration: none;
      box-shadow:      0 8px 24px rgba(15,118,110,.35);
      transition:      transform .3s, box-shadow .3s;
    }
    .btn:hover {
      transform:  translateY(-3px);
      box-shadow: 0 14px 32px rgba(15,118,110,.5);
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%     { transform: translateY(-12px); }
    }
    .blob {
      position:  fixed;
      border-radius: 50%;
      filter:    blur(80px);
      z-index:   -1;
      pointer-events: none;
    }
    .blob-1 { width:400px; height:400px; top:-100px; right:-100px; background:radial-gradient(circle, rgba(20,184,166,.20) 0%, transparent 70%); }
    .blob-2 { width:300px; height:300px; bottom:-80px; left:-80px; background:radial-gradient(circle, rgba(34,197,94,.15) 0%, transparent 70%); }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="wrap">
    <div class="big-num">404</div>
    <div class="icon-wrap"><i class="fa-solid fa-stethoscope"></i></div>
    <h1>Page Not Found</h1>
    <p>
      Oops! The page you're looking for has gone on sick leave.<br>
      Let's get you back to good health — and the right page.
    </p>
    <a href="index.html" class="btn">
      <i class="fa-solid fa-house-medical"></i> Back to Home
    </a>
  </div>
</body>
</html>
