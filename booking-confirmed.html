<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Appointment Confirmed | CozPiraa Clinic</title>
  <link rel="icon" type="image/png" href="assets/images/latest.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --primary:   #E8600A;
      --secondary: #D97706;
      --accent:    #EAB308;
      --bg:        #FFFBF5;
      --card:      #FFFFFF;
      --text:      #1C0A00;
      --text-light:#7C5A3A;
      --text-muted:#BEA080;
      --border:    rgba(232,96,10,0.15);
      --shadow-lg: 0 20px 60px rgba(232,96,10,0.18);
      --ease:      cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #FFF7ED 0%, #FFFBF5 50%, #FEF3E2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
    }

    /* Blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 500px; height: 500px;
      top: -120px; right: -120px;
      background: radial-gradient(circle, rgba(234,179,8,.22) 0%, transparent 70%);
    }
    .blob-2 {
      width: 400px; height: 400px;
      bottom: -80px; left: -100px;
      background: radial-gradient(circle, rgba(232,96,10,.18) 0%, transparent 70%);
    }

    /* Card */
    .confirm-card {
      position: relative;
      z-index: 1;
      background: var(--card);
      border-radius: 28px;
      padding: 52px 44px 44px;
      width: min(520px, 100%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      text-align: center;
      animation: popIn .5s var(--ease) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(.94) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .confirm-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
    }

    /* Checkmark */
    .success-circle {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #16A34A, #22C55E);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 2.4rem;
      color: #fff;
      box-shadow: 0 8px 32px rgba(22,163,74,.35);
      animation: checkPop .6s .2s var(--ease) both;
    }

    @keyframes checkPop {
      0%   { transform: scale(0); opacity: 0; }
      70%  { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .subtitle {
      font-size: .95rem;
      color: var(--text-light);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* Details box */
    .details-box {
      background: linear-gradient(135deg, rgba(232,96,10,.05), rgba(234,179,8,.05));
      border: 1px solid rgba(232,96,10,.18);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
      text-align: left;
    }

    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(232,96,10,.08);
    }
    .detail-row:last-child { border-bottom: none; padding-bottom: 0; }
    .detail-row:first-child { padding-top: 0; }

    .detail-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, rgba(232,96,10,.12), rgba(234,179,8,.12));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .82rem;
      color: var(--primary);
      flex-shrink: 0;
    }

    .detail-label {
      font-size: .74rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .06em;
      display: block;
    }

    .detail-val {
      font-size: .92rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Booking ref */
    .ref-box {
      background: linear-gradient(135deg, rgba(232,96,10,.10), rgba(234,179,8,.10));
      border: 1.5px solid rgba(232,96,10,.25);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .ref-label {
      font-size: .74rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .ref-code {
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--primary);
      letter-spacing: .1em;
      word-break: break-all;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 130px;
      padding: 14px 20px;
      border-radius: 12px;
      font-family: inherit;
      font-size: .92rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all .3s var(--ease);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #fff;
      box-shadow: 0 6px 20px rgba(232,96,10,.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(232,96,10,.45); }

    .btn-outline {
      background: transparent;
      color: var(--text-light);
      border: 1.5px solid rgba(232,96,10,.25);
    }
    .btn-outline:hover { background: rgba(232,96,10,.06); color: var(--primary); }

    /* Note */
    .note {
      margin-top: 20px;
      font-size: .78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .note i { color: var(--primary); }

    /* Logo top */
    .top-logo {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      text-decoration: none;
    }
    .top-logo img { width: 40px; height: 40px; border-radius: 11px; }
    .top-logo .brand { font-size: 1.05rem; font-weight: 800; color: var(--text); }
    .top-logo .sub   { font-size: .7rem; color: var(--text-muted); display: block; }

    /* Mobile */
    @media (max-width: 480px) {
      .confirm-card { padding: 40px 20px 32px; border-radius: 20px; }
      h1 { font-size: 1.4rem; }
      .success-circle { width: 72px; height: 72px; font-size: 2rem; }
      .details-box { padding: 16px; }
      .btn-group { flex-direction: column; }
      .btn { min-width: unset; width: 100%; }
      .ref-code { font-size: .95rem; }
    }
  </style>
</head>
<body>

  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <a href="index.html" class="top-logo">
    <img src="assets/images/latest.png" alt="CozPiraa Clinic" />
    <div>
      <span class="brand">CozPiraa</span>
      <span class="sub">Clinic · Virar West</span>
    </div>
  </a>

  <div class="confirm-card">

    <div class="success-circle">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1>Appointment Confirmed! 🎉</h1>
    <p class="subtitle">
      Your slot has been booked successfully.<br>
      Please arrive <strong>10 minutes early</strong> at CozPiraa Clinic, Virar West.
    </p>

    <!-- Booking details populated by JS -->
    <div class="details-box" id="detailsBox">
      <div class="detail-row">
        <div class="detail-icon"><i class="fa-solid fa-user"></i></div>
        <div>
          <span class="detail-label">Patient Name</span>
          <span class="detail-val" id="dName">—</span>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-icon"><i class="fa-solid fa-calendar-days"></i></div>
        <div>
          <span class="detail-label">Date</span>
          <span class="detail-val" id="dDay">—</span>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-icon"><i class="fa-solid fa-clock"></i></div>
        <div>
          <span class="detail-label">Time Slot</span>
          <span class="detail-val" id="dSlot">—</span>
        </div>
      </div>
      <div class="detail-row">
        <div class="detail-icon"><i class="fa-solid fa-phone"></i></div>
        <div>
          <span class="detail-label">Phone</span>
          <span class="detail-val" id="dPhone">—</span>
        </div>
      </div>
    </div>

    <div class="ref-box">
      <div>
        <div class="ref-label">Booking Reference</div>
        <div class="ref-code" id="dRef">—</div>
      </div>
    </div>

    <div class="btn-group">
      <a href="index.html" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Back to Home
      </a>
      <a href="appointment.html" class="btn btn-outline">
        <i class="fa-solid fa-calendar-plus"></i> Book Another
      </a>
    </div>

    <p class="note">
      <i class="fa-solid fa-shield-halved"></i>
      Screenshot this page to save your booking details.
    </p>

  </div>

  <script>
    // Read booking details from URL params
    const params = new URLSearchParams(window.location.search);

    const SLOT_LABELS = {
      '10:00-11:00': '10:00 – 11:00 AM',
      '11:00-12:00': '11:00 AM – 12:00 PM',
      '12:00-13:00': '12:00 – 1:00 PM',
      '13:00-14:00': '1:00 – 2:00 PM',
      '14:00-15:00': '2:00 – 3:00 PM',
      '15:00-16:00': '3:00 – 4:00 PM',
      '16:00-17:00': '4:00 – 5:00 PM',
      '17:00-18:00': '5:00 – 6:00 PM',
      '18:00-19:00': '6:00 – 7:00 PM',
      '19:00-20:00': '7:00 – 8:00 PM',
      '20:00-20:30': '8:00 – 8:30 PM',
    };

    function formatDate(d) {
      if (!d) return '—';
      const [y, m, day] = d.split('-');
      return new Date(+y, +m - 1, +day).toLocaleDateString('en-IN', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    const name  = params.get('name')  || '—';
    const day   = params.get('day')   || '';
    const slot  = params.get('slot')  || '';
    const phone = params.get('phone') || '—';
    const ref   = params.get('ref')   || '—';

    document.getElementById('dName').textContent  = name;
    document.getElementById('dDay').textContent   = formatDate(day);
    document.getElementById('dSlot').textContent  = SLOT_LABELS[slot] || slot || '—';
    document.getElementById('dPhone').textContent = phone;
    document.getElementById('dRef').textContent   = ref;

    // If no ref in URL — they landed here directly, redirect to appointment page
    if (!params.get('ref')) {
      window.location.replace('appointment.html');
    }
  </script>

</body>
</html>
